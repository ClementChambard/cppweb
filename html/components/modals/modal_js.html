<div class="modal-popover" popover id="{{popover_id}}">
  <div class="modal-container">
    <div class="modal-transition">
      <div class="modal-box">
        <div class="modal-header">
          <button type="button" popovertarget="{{popover_id}}" class="modal-close transition">
            <{components::icon} size="18" icon="close" />
          </button>
          <div class="modal-title">{{title}}</div>
        </div>
        <div class="modal-body">{{children}}</div>
        <div class="modal-footer">
          <div class="modal-buttons">
            {{action_2nd_label?{{
            <button class="btn-component transition outline" onclick="{{handleSecondaryAction}}">
              {{action_2nd_label}}
            </button>}}}}
            <button class="btn-component transition" onclick="{{onclick}}">{{action_label}}</button>
          </div>
          {{footer?}}
        </div>
      </div>
    </div>
  </div>
</div>
